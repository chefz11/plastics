<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Egg - 3D Photo Morphing</title>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://unpkg.com/gif.js@0.2.0/dist/gif.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fff;
      --text-color: #333;
      --accent-color: #e8e8e8;
      --border-color: #ccc;
      --btn-bg: #fff;
      --btn-hover: #eee;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      overflow: hidden;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100vh;
    }

    .screen.active {
      display: flex;
    }

    /* Upload Screen */
    #upload-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 24px;
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: 48px;
      font-weight: 600;
      color: var(--text-color);
    }

    .drop-zone {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      border: 3px dashed var(--border-color);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--btn-bg);
      position: relative;
      overflow: hidden;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--text-color);
      background: var(--accent-color);
    }

    .drop-zone.has-image {
      border-style: solid;
    }

    .drop-zone svg {
      width: 80px;
      height: 100px;
      fill: var(--border-color);
      transition: fill 0.2s ease;
    }

    .drop-zone:hover svg {
      fill: var(--text-color);
    }

    .drop-zone-text {
      font-size: 16px;
      color: #888;
      text-align: center;
    }

    .drop-zone-preview {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--btn-bg);
    }

    .drop-zone-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .drop-zone.has-image .drop-zone-preview {
      display: flex;
    }

    .drop-zone.has-image svg,
    .drop-zone.has-image .drop-zone-text {
      display: none;
    }

    #file-input {
      display: none;
    }

    .name-input-wrapper {
      width: 100%;
      max-width: 360px;
    }

    .name-input-wrapper label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    #name-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 18px;
      font-family: 'Caveat', cursive;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s ease;
    }

    #name-input:focus {
      border-color: var(--text-color);
    }

    #name-input::placeholder {
      color: #aaa;
    }

    #continue-btn {
      width: 100%;
      max-width: 360px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 500;
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.4;
      pointer-events: none;
    }

    #continue-btn.enabled {
      opacity: 1;
      pointer-events: auto;
    }

    #continue-btn.enabled:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .loading-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #666;
    }

    .loading-indicator.visible {
      display: flex;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-color);
      border-top-color: var(--text-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Editor Screen */
    #editor-screen {
      flex-direction: column;
      position: relative;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
    }

    .shape-selector {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .shape-selector button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: #999;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .shape-selector button:hover {
      color: var(--text-color);
    }

    .shape-selector button.active {
      background: var(--btn-bg);
      color: var(--text-color);
      box-shadow: var(--shadow);
    }

    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .bottom-bar button {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #start-over-btn {
      background: var(--btn-bg);
      color: var(--text-color);
      box-shadow: var(--shadow);
    }

    #start-over-btn:hover {
      background: var(--accent-color);
    }

    #start-over-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    #download-btn {
      background: var(--text-color);
      color: var(--bg-color);
    }

    #download-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    #download-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #download-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .title {
        font-size: 36px;
      }

      .drop-zone {
        max-width: 280px;
      }

      .name-input-wrapper,
      #continue-btn {
        max-width: 280px;
      }

      .toolbar button {
        width: 42px;
        height: 42px;
      }

      .bottom-bar button {
        padding: 12px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Upload Screen -->
  <div id="upload-screen" class="screen active">
    <h1 class="title">Egg</h1>

    <div class="drop-zone" id="drop-zone">
      <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="40" cy="55" rx="35" ry="42" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M25 50 L35 60 L55 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="drop-zone-text">Drop or search a photo</span>
      <div class="drop-zone-preview">
        <img id="preview-image" alt="Preview">
      </div>
    </div>
    <input type="file" id="file-input" accept="image/*,.heic,.heif">

    <div class="loading-indicator" id="loading-indicator">
      <div class="spinner"></div>
      <span>Processing image...</span>
    </div>

    <div class="name-input-wrapper">
      <label for="name-input">Name Your Egg</label>
      <input type="text" id="name-input">
    </div>

    <button id="continue-btn">Continue</button>
  </div>

  <!-- Editor Screen -->
  <div id="editor-screen" class="screen">
    <div id="canvas-container"></div>

    <div class="shape-selector">
      <button id="shape-egg" class="active">Egg</button>
      <button id="shape-heart">Heart</button>
      <button id="shape-gem">Gem</button>
    </div>

    <div class="bottom-bar">
      <button id="start-over-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
        Start Over
      </button>
      <button id="download-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        Download
      </button>
    </div>
  </div>

  <script>
    // App State
    const AppState = {
      currentScreen: 'upload',
      uploadedImage: null,
      userName: '',
      currentShape: 'egg',
      // Three.js refs
      scene: null,
      camera: null,
      renderer: null,
      shapeMesh: null,
      controls: null
    };

    // Utility Functions
    async function processImageFile(file) {
      const isHeic = file.type === 'image/heic' ||
                     file.type === 'image/heif' ||
                     file.name.toLowerCase().endsWith('.heic') ||
                     file.name.toLowerCase().endsWith('.heif');

      if (isHeic && typeof heic2any !== 'undefined') {
        showLoading(true);
        try {
          const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
          return blobToDataURL(blob);
        } finally {
          showLoading(false);
        }
      }

      return blobToDataURL(file);
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function showLoading(visible) {
      document.getElementById('loading-indicator').classList.toggle('visible', visible);
    }

    // Egg Geometry
    function createEggGeometry(widthSegments = 64, heightSegments = 32) {
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const uvs = [];
      const indices = [];

      // Egg parameters
      const a = 1.0;  // radius at equator
      const b = 1.4;  // height (top to bottom)
      const k = 0.2;  // asymmetry factor (larger = pointier top)

      for (let y = 0; y <= heightSegments; y++) {
        const v = y / heightSegments;
        const phi = v * Math.PI; // 0 to PI

        for (let x = 0; x <= widthSegments; x++) {
          const u = x / widthSegments;
          const theta = u * Math.PI * 2; // 0 to 2PI

          // Egg equation with asymmetry
          const sinPhi = Math.sin(phi);
          const cosPhi = Math.cos(phi);
          const asymmetry = 1 + k * cosPhi; // Makes bottom rounder, top pointier

          const px = a * sinPhi * Math.cos(theta) * asymmetry;
          const py = -b * cosPhi; // Negative to orient correctly
          const pz = a * sinPhi * Math.sin(theta) * asymmetry;

          vertices.push(px, py, pz);
          uvs.push(u, 1 - v);
        }
      }

      // Generate indices
      for (let y = 0; y < heightSegments; y++) {
        for (let x = 0; x < widthSegments; x++) {
          const a = y * (widthSegments + 1) + x;
          const b = a + widthSegments + 1;

          indices.push(a, b, a + 1);
          indices.push(b, b + 1, a + 1);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    // Heart Geometry - soft, rounded heart shape
    function createHeartGeometry(widthSegments = 64, heightSegments = 32) {
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const uvs = [];
      const indices = [];

      const scale = 0.085;

      for (let y = 0; y <= heightSegments; y++) {
        const v = y / heightSegments;
        const phi = v * Math.PI;

        for (let x = 0; x <= widthSegments; x++) {
          const u = x / widthSegments;
          const theta = u * Math.PI * 2;

          const sinPhi = Math.sin(phi);
          const cosPhi = Math.cos(phi);
          const sinTheta = Math.sin(theta);
          const cosTheta = Math.cos(theta);

          // Softer heart equation with rounder bottom
          const heartX = 16 * sinTheta * sinTheta * sinTheta;
          const heartY = 13 * cosTheta - 5 * Math.cos(2 * theta) - 2 * Math.cos(3 * theta) - Math.cos(4 * theta);

          // Soften the bottom point by blending toward a sphere
          const sphereBlend = Math.pow(Math.max(0, -cosTheta), 2) * 0.4;
          const softY = heartY * (1 - sphereBlend) + (12 * cosTheta) * sphereBlend;

          // Flip Y to orient heart right-side up (lobes at top, point at bottom)
          const px = scale * sinPhi * heartX;
          const py = scale * sinPhi * softY;
          const pz = scale * 8 * cosPhi;

          vertices.push(px, py, pz);
          uvs.push(u, 1 - v);
        }
      }

      // Generate indices (reversed winding order for correct normals)
      for (let y = 0; y < heightSegments; y++) {
        for (let x = 0; x < widthSegments; x++) {
          const a = y * (widthSegments + 1) + x;
          const b = a + widthSegments + 1;

          indices.push(a, a + 1, b);
          indices.push(b, a + 1, b + 1);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    // Gem (Dodecahedron) Geometry with UVs
    function createGemGeometry() {
      // Use Three.js DodecahedronGeometry as base
      const dodeca = new THREE.DodecahedronGeometry(1.2, 0);

      // Compute UVs based on spherical projection
      const positions = dodeca.getAttribute('position');
      const uvs = [];

      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const y = positions.getY(i);
        const z = positions.getZ(i);

        // Spherical UV mapping
        const len = Math.sqrt(x * x + y * y + z * z);
        const u = 0.5 + Math.atan2(z, x) / (2 * Math.PI);
        const v = 0.5 - Math.asin(y / len) / Math.PI;

        uvs.push(u, v);
      }

      dodeca.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

      return dodeca;
    }

    // Three.js Setup
    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      // Scene
      AppState.scene = new THREE.Scene();
      AppState.scene.background = new THREE.Color(0xffffff);

      // Camera
      AppState.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      AppState.camera.position.set(0, 0, 5);

      // Renderer
      AppState.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      AppState.renderer.setSize(width, height);
      AppState.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      AppState.renderer.shadowMap.enabled = true;
      AppState.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(AppState.renderer.domElement);

      // Lighting
      createLighting();

      // Shape
      createShape();

      // Shadow plane
      createShadowPlane();

      // Controls
      AppState.controls = new THREE.OrbitControls(AppState.camera, AppState.renderer.domElement);
      AppState.controls.enableDamping = true;
      AppState.controls.dampingFactor = 0.05;
      AppState.controls.minDistance = 3;
      AppState.controls.maxDistance = 10;
      AppState.controls.enablePan = false;

      // Window resize
      window.addEventListener('resize', onWindowResize);

      // Animation loop
      animate();
    }

    function createLighting() {
      // Ambient light - higher intensity for softer look
      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      AppState.scene.add(ambient);

      // Main directional light with shadows - softer
      const mainLight = new THREE.DirectionalLight(0xffffff, 0.5);
      mainLight.position.set(5, 10, 7);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 1024;
      mainLight.shadow.mapSize.height = 1024;
      mainLight.shadow.camera.near = 0.5;
      mainLight.shadow.camera.far = 50;
      mainLight.shadow.camera.left = -5;
      mainLight.shadow.camera.right = 5;
      mainLight.shadow.camera.top = 5;
      mainLight.shadow.camera.bottom = -5;
      mainLight.shadow.bias = -0.001;
      AppState.scene.add(mainLight);

      // Fill light - softer
      const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
      fillLight.position.set(-5, 5, -5);
      AppState.scene.add(fillLight);
    }

    function getGeometryForShape(shape) {
      switch (shape) {
        case 'heart':
          return createHeartGeometry();
        case 'gem':
          return createGemGeometry();
        case 'egg':
        default:
          return createEggGeometry();
      }
    }

    function createShape() {
      const geometry = getGeometryForShape(AppState.currentShape);

      // Load texture
      const textureLoader = new THREE.TextureLoader();
      const texture = textureLoader.load(AppState.uploadedImage);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.flipY = true;
      texture.repeat.set(1, -1);
      texture.offset.set(0, 1);

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 1.0,
        metalness: 0.0
      });

      AppState.shapeMesh = new THREE.Mesh(geometry, material);
      AppState.shapeMesh.castShadow = true;
      AppState.shapeMesh.receiveShadow = true;
      AppState.scene.add(AppState.shapeMesh);
    }

    function changeShape(newShape) {
      if (newShape === AppState.currentShape) return;

      AppState.currentShape = newShape;

      // Remove old mesh
      if (AppState.shapeMesh) {
        AppState.scene.remove(AppState.shapeMesh);
        AppState.shapeMesh.geometry.dispose();
        // Keep material for reuse
      }

      // Create new geometry
      const geometry = getGeometryForShape(newShape);

      // Reuse existing material
      AppState.shapeMesh = new THREE.Mesh(geometry, AppState.shapeMesh.material);
      AppState.shapeMesh.castShadow = true;
      AppState.shapeMesh.receiveShadow = true;
      AppState.scene.add(AppState.shapeMesh);

      // Update button states
      document.querySelectorAll('.shape-selector button').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(`shape-${newShape}`).classList.add('active');
    }

    function createShadowPlane() {
      const shadowGeo = new THREE.PlaneGeometry(10, 10);
      const shadowMat = new THREE.ShadowMaterial({ opacity: 0.15 });
      const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.y = -1.6;
      shadowPlane.receiveShadow = true;
      AppState.scene.add(shadowPlane);
    }


    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth;
      const height = container.clientHeight;

      AppState.camera.aspect = width / height;
      AppState.camera.updateProjectionMatrix();
      AppState.renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (AppState.controls) {
        AppState.controls.update();
      }

      AppState.renderer.render(AppState.scene, AppState.camera);
    }

    // Export
    function exportPolaroid() {
      const EXPORT_WIDTH = 400;
      const EXPORT_HEIGHT = 500;
      const BORDER = 20;
      const BOTTOM_BORDER = 60;
      const NUM_FRAMES = 36;
      const FRAME_DELAY = 80; // ms per frame

      const renderWidth = EXPORT_WIDTH - BORDER * 2;
      const renderHeight = EXPORT_HEIGHT - BORDER - BOTTOM_BORDER;

      // Disable download button during export
      const downloadBtn = document.getElementById('download-btn');
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Creating GIF...';

      // Random angle for name (-8 to 8 degrees)
      const nameAngle = (Math.random() - 0.5) * 16 * (Math.PI / 180);

      // Store original rotation
      const originalRotation = AppState.shapeMesh.rotation.y;

      // Create temporary camera with correct aspect ratio for export
      const exportCamera = new THREE.PerspectiveCamera(
        45,
        renderWidth / renderHeight,
        0.1,
        100
      );
      exportCamera.position.set(0, 0, 5);
      exportCamera.lookAt(0, 0, 0);

      // Create offscreen renderer
      const exportRenderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
        alpha: false
      });
      exportRenderer.setSize(renderWidth, renderHeight);
      exportRenderer.setPixelRatio(1);
      exportRenderer.shadowMap.enabled = true;
      exportRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Create GIF encoder
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: EXPORT_WIDTH,
        height: EXPORT_HEIGHT,
        workerScript: '/projects/Egg/gif.worker.js'
      });

      // Create polaroid canvas
      const canvas = document.createElement('canvas');
      canvas.width = EXPORT_WIDTH;
      canvas.height = EXPORT_HEIGHT;
      const ctx = canvas.getContext('2d');

      // Generate frames
      for (let i = 0; i < NUM_FRAMES; i++) {
        // Rotate shape
        AppState.shapeMesh.rotation.y = originalRotation + (i / NUM_FRAMES) * Math.PI * 2;

        // Render scene
        exportRenderer.render(AppState.scene, exportCamera);

        // Draw polaroid frame
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);

        // Draw rendered shape
        ctx.drawImage(exportRenderer.domElement, BORDER, BORDER, renderWidth, renderHeight);

        // Draw name with random angle
        ctx.save();
        ctx.translate(EXPORT_WIDTH / 2, EXPORT_HEIGHT - 25);
        ctx.rotate(nameAngle);
        ctx.fillStyle = '#333';
        ctx.font = '500 24px Caveat, cursive';
        ctx.textAlign = 'center';
        ctx.fillText(AppState.userName || 'Egg', 0, 0);
        ctx.restore();

        // Add frame to GIF
        gif.addFrame(ctx, { copy: true, delay: FRAME_DELAY });
      }

      // Restore original rotation
      AppState.shapeMesh.rotation.y = originalRotation;

      // Finish GIF
      gif.on('finished', function(blob) {
        // Download
        const link = document.createElement('a');
        link.download = `${AppState.currentShape}-${AppState.userName || 'photo'}.gif`;
        link.href = URL.createObjectURL(blob);
        link.click();
        URL.revokeObjectURL(link.href);

        // Re-enable download button
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download`;

        // Cleanup
        exportRenderer.dispose();
      });

      gif.render();
    }

    // Screen Management
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(`${screenId}-screen`).classList.add('active');
      AppState.currentScreen = screenId;
    }

    function updateContinueButton() {
      const btn = document.getElementById('continue-btn');
      const hasImage = AppState.uploadedImage !== null;
      const hasName = AppState.userName.trim().length > 0;
      btn.classList.toggle('enabled', hasImage && hasName);
    }

    // Upload Screen Setup
    function setupUploadScreen() {
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const nameInput = document.getElementById('name-input');
      const continueBtn = document.getElementById('continue-btn');
      const previewImg = document.getElementById('preview-image');

      // Click to select
      dropZone.addEventListener('mousedown', (e) => {
        e.preventDefault();
      });

      dropZone.addEventListener('click', (e) => {
        fileInput.click();
      });

      // File input change
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          await handleFile(file);
        }
        // Reset input so same file can be selected again
        fileInput.value = '';
      });

      // Drag and drop
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
      });

      dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) {
          await handleFile(file);
        }
      });

      async function handleFile(file) {
        try {
          AppState.uploadedImage = await processImageFile(file);
          previewImg.src = AppState.uploadedImage;
          dropZone.classList.add('has-image');
          updateContinueButton();
        } catch (err) {
          console.error('Failed to process image:', err);
          alert('Failed to process image. Please try another file.');
        }
      }

      // Name input
      nameInput.addEventListener('input', (e) => {
        AppState.userName = e.target.value;
        updateContinueButton();
      });

      // Continue button
      continueBtn.addEventListener('click', () => {
        if (AppState.uploadedImage && AppState.userName.trim()) {
          showScreen('editor');
          initThreeJS();
        }
      });
    }

    // Start Over - reset and go back to upload screen
    function startOver() {
      // Clean up Three.js resources
      if (AppState.shapeMesh) {
        AppState.scene.remove(AppState.shapeMesh);
        AppState.shapeMesh.geometry.dispose();
        AppState.shapeMesh.material.map.dispose();
        AppState.shapeMesh.material.dispose();
        AppState.shapeMesh = null;
      }

      if (AppState.renderer) {
        AppState.renderer.dispose();
        const container = document.getElementById('canvas-container');
        if (container.firstChild) {
          container.removeChild(container.firstChild);
        }
      }

      if (AppState.controls) {
        AppState.controls.dispose();
      }

      // Reset state
      AppState.scene = null;
      AppState.camera = null;
      AppState.renderer = null;
      AppState.controls = null;
      AppState.uploadedImage = null;
      AppState.userName = '';
      AppState.currentShape = 'egg';

      // Reset UI
      const dropZone = document.getElementById('drop-zone');
      dropZone.classList.remove('has-image');
      document.getElementById('preview-image').src = '';
      document.getElementById('name-input').value = '';
      document.getElementById('continue-btn').classList.remove('enabled');

      // Reset shape selector
      document.querySelectorAll('.shape-selector button').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById('shape-egg').classList.add('active');

      // Show upload screen
      showScreen('upload');
    }

    // Editor Screen Setup
    function setupEditorScreen() {
      // Shape selector buttons
      document.getElementById('shape-egg').addEventListener('click', () => changeShape('egg'));
      document.getElementById('shape-heart').addEventListener('click', () => changeShape('heart'));
      document.getElementById('shape-gem').addEventListener('click', () => changeShape('gem'));

      // Start over button
      document.getElementById('start-over-btn').addEventListener('click', startOver);

      // Download button
      document.getElementById('download-btn').addEventListener('click', exportPolaroid);
    }

    // Initialize
    function init() {
      setupUploadScreen();
      setupEditorScreen();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
